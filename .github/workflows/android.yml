name: Build Cursive APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cursive-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Chaquopy compiles the Python sources to .pyc at build time, which needs
      # the matching Python version on the build machine.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Produces the fully static editor bundle in `out/` (Monaco copied in and
      # no server, no API routes) so Capacitor bakes it *inside* the APK.
      - name: Build bundled web assets
        run: npm run build:android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Materialise the ONE permanent signing key from the repo secret. If the
      # secret is missing we stop loudly rather than publish a differently-
      # signed APK that users could not install over their existing Cursive.
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret SIGNING_KEYSTORE_BASE64 is not set. Add the permanent signing keystore (see docs/signing-setup.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cursive-release.keystore"
          "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/cursive-release.keystore" -storepass "$SIGNING_PASSWORD" > /dev/null
          echo "Signing keystore is valid."

      - name: Build signed release APK
        working-directory: android
        env:
          CURSIVE_KEYSTORE_FILE: ${{ runner.temp }}/cursive-release.keystore
          CURSIVE_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CURSIVE_KEY_ALIAS: cursive
          CURSIVE_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Cursive.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cursive-apk
          path: dist/Cursive.apk
          if-no-files-found: error

      - name: Publish "Cursive latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cursive-latest
          name: Cursive latest
          body: |
            Latest Android build of Cursive.

            Tap **Cursive.apk** below to download it, then open the file on your
            phone to install. You may need to allow "Install unknown apps" for
            your browser the first time.
          files: dist/Cursive.apk
          make_latest: true
          fail_on_unmatched_files: true

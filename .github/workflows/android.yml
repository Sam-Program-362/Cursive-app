name: Build Cursive Android APK

on:
  push:
    branches:
      - main
      # Temporary branch build so this first APK can be verified before
      # merging the workflow to main. Remove after the first successful run.
      - arena/01a0f9b7-cursive-app
  workflow_dispatch:

# The release step uses the automatically-created token to replace the
# "Cursive latest" release on every build from main.
permissions:
  contents: write

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Cursive
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Android API 36 is available
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        working-directory: android
        run: |
          # Capacitor 8 generates Java 21 compile options by default. The
          # Capacitor Android runtime itself supports JDK 17, so keep this
          # build compatible with the requested JDK 17 action image.
          sed -i 's/VERSION_21/VERSION_17/g' app/capacitor.build.gradle
          mkdir -p app/libs capacitor-cordova-android-plugins/src/main/libs
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --info > gradle-build.log 2>&1
          status=$?
          tail -120 gradle-build.log
          if [ "$status" -ne 0 ]; then
            summary=$(grep -A12 -B2 -E '^FAILURE:|^\* What went wrong:' gradle-build.log | head -35 | tr '\n' ' ' | cut -c1-900)
            if [ -z "$summary" ]; then summary=$(grep -E '^> |^Execution failed|^Caused by:' gradle-build.log | head -12 | tr '\n' ' ' | cut -c1-900); fi
            if [ -z "$summary" ]; then summary=$(tail -8 gradle-build.log | tr '\n' ' ' | cut -c1-900); fi
            echo "::error title=Gradle build failure::$summary"
          fi
          exit "$status"

      - name: Upload Gradle failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursive-gradle-log
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop after a failed Gradle build
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Cursive latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: Cursive latest
          tag_name: cursive-latest
          body: |
            Latest Cursive Android debug APK.

            This APK loads https://cursive-coding.vercel.app in the native Cursive shell.
            Android may ask you to allow your browser to install apps from unknown sources.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

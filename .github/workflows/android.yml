name: Build Cursive Android APK

on:
  push:
    branches:
      - main
      # Temporary branch build so this first APK can be verified before
      # merging the workflow to main. Remove after the first successful run.
      - arena/01a0f9b7-cursive-app
  workflow_dispatch:

# The release step uses the automatically-created token to replace the
# "Cursive latest" release on every build from main.
permissions:
  contents: write

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Cursive
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          # Capacitor 8 generates Java 21 compile options by default. The
          # Capacitor Android runtime itself supports JDK 17, so keep this
          # build compatible with the requested JDK 17 action image.
          sed -i 's/VERSION_21/VERSION_17/g' app/capacitor.build.gradle
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log

      - name: Upload Gradle failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursive-gradle-log
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Cursive latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: Cursive latest
          tag_name: cursive-latest
          body: |
            Latest Cursive Android debug APK.

            This APK loads https://cursive-coding.vercel.app in the native Cursive shell.
            Android may ask you to allow your browser to install apps from unknown sources.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

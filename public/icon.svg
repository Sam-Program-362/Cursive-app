<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Flowing cursive "C" stroke -->
  <path d="M 336 176
           C 300 142, 224 138, 178 172
           C 128 208, 122 292, 168 336
           C 208 374, 272 378, 316 350"
        fill="none"
        stroke="url(#stroke)"
        stroke-width="34"
        stroke-linecap="round"/>

  <!-- Blinking cursor accent, tucked at the stroke's tail -->
  <rect x="322" y="318" width="26" height="66" rx="6" fill="#38bdf8"/>
</svg>
